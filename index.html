<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSolution APP</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="shortcut icon" href="/icon.png">

    <!-- PWA: Manifest -->
    <link rel="manifest" href="/manifest.json?v=3">

    <!-- PWA: Theme color (barra do browser / taskbar Windows) -->
    <meta name="theme-color" content="#685BC7">

    <!-- PWA: iOS / macOS Safari -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="APP">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-bg.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-bg.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-bg.png">

    <!-- PWA: Windows / Edge / Chrome -->
    <meta name="msapplication-TileImage" content="/icon.png">
    <meta name="msapplication-TileColor" content="#685BC7">
    <meta name="application-name" content="APP">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root { 
            --ps-blue: #685BC7; 
            --ps-black: #131417; 
        }
        
        * { box-sizing: border-box; }
        html, body { height: 100dvh; margin: 0; padding: 0; overflow: hidden; }
        body { font-family: 'Archivo', sans-serif; font-stretch: 100%; overflow: hidden; transition: background-color 0.3s ease; }

        /* =============================================
           DESIGN SYSTEM: TYPOGRAPHY
           Bloco centralizado de tipografia.
           Todas as views referenciam estas classes.
        ============================================= */

        /* Títulos principais de seção/página (ex: "Seja bem-vindo(a)!", "Heatmap Operacional", "Módulo em Desenvolvimento") */
        .ds-title { font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 300; font-stretch: 125%; letter-spacing: -0.02em; color: var(--text-main); }

        /* Títulos de gráficos e seções de cards (ex: "Frequência de Interação por Hora", "Ranking de PDVs", "Matriz de Execução") */
        .ds-chart-title { font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 600; font-stretch: 125%; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3em; }

        /* Valores numéricos grandes dos KPIs (ex: "1.234", "56") — fonte Michroma para destaque */
        .ds-kpi-value { font-family: 'Michroma', sans-serif; font-weight: 400; color: var(--text-main); }

        /* Labels acima dos KPIs (ex: "Volume de Sessões", "Pontos de Venda", "Aparelhos Ativos") */
        .ds-kpi-label { font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 600; font-stretch: 125%; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3em; }

        /* Labels dos filtros globais e do heatmap (ex: "Período", "Localidade", "Modelo Alvo") */
        .ds-filter-label { font-family: 'Archivo', sans-serif; font-weight: 300; font-stretch: 110%; text-transform: uppercase; font-size: 9px; color: var(--text-main); opacity: 0.8; }

        /* Texto dentro dos botões/selects de filtro (ex: valor selecionado "TODOS") */
        .ds-filter-input { font-weight: 600; font-stretch: 100%; font-size: 12px; }

        /* Itens de menu lateral / sidebar (reservado para uso futuro) */
        .ds-sidebar-item { font-weight: 600; font-stretch: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Títulos dentro de tooltips e painéis auxiliares (ex: "Aparelhos Ativos por Linha de Produto" no tooltip da Overview) */
        .ds-sidebar-title { font-weight: 800; font-stretch: 100%; font-size: 9px; color: var(--text-muted-strong); text-transform: uppercase; }

        /* Textos auxiliares e subtítulos discretos (ex: "Sessão iniciada com sucesso", "(12 Lojas)" na Positivação) */
        .ds-helper-text { font-weight: 400; font-stretch: 100%; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; }

        /* Inputs da tela de login (ex: campos de e-mail e senha) */
        .ds-login-input { font-weight: 600; font-stretch: 100%; font-size: 11px; }

        /* Nome do produto na tela de login — fonte Syncopate exclusiva */
        .ds-login-product { font-family: 'Syncopate', sans-serif; font-weight: 700; letter-spacing: 0.5em; color: #ffffff; }

        /* Classe utilitária para TODOS os números em tabelas, tooltips, badges e drilldowns — Michroma garante consistência numérica */
        .font-numbers { font-family: 'Michroma', sans-serif !important; }

        /* Pills de navegação principal e botão de logout (ex: "Visão Geral", "Positivação", "Heatmap", "Performance", "Sair") */
        .ds-nav-pill { font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; font-stretch: 120%; text-transform: uppercase; letter-spacing: 0.06em; }

        /* E-mail do usuário logado exibido na topbar */
        .ds-user-email { font-family: 'Archivo', sans-serif; font-size: 14px; font-stretch: 140%; font-weight: 400; }

        /* Subtítulos descritivos abaixo de títulos de seção (ex: "Análise de crescimento temporal", "Interações por unidade ativa") */
        .ds-chart-subtitle { font-family: 'Archivo', sans-serif; font-size: 9px; font-weight: 600; font-stretch: 100%; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* Texto de badges e tags (ex: "BETA", "INSIGHT") */
        .ds-badge-text { font-family: 'Archivo', sans-serif; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; }

        /* Cabeçalhos de tabelas (ex: colunas "Linha de Produto", "Aparelho", "Ativos", "Presença") */
        .ds-table-header { font-family: 'Archivo', sans-serif; font-size: 9px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.2em; }

        /* Células de texto em tabelas (ex: nomes de lojas, aparelhos, redes) */
        .ds-table-cell { font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 600; color: var(--text-main); }

        /* Valores numéricos em tabelas (ex: quantidades, percentuais) — herda Michroma de .font-numbers */
        .ds-table-value { font-family: 'Michroma', sans-serif; font-weight: 900; color: #685BC7; }

        /* Texto do insight rotativo na Overview (ex: "PROSOLUTION ANALYTICS: O modelo...") */
        .ds-insight-text { font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: -0.01em; color: var(--text-main); }

        /* Botões de alternância de modo (ex: "Dia/Semana/Mês", "Por Rede/Por Tipo de Loja", "Visão por Loja/Aparelho") */
        .ds-mode-btn { font-family: 'Archivo', sans-serif; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }

        /* Texto do score/gauge de saúde dos PDVs (fonte Michroma para números de score) */
        .ds-gauge-text { font-family: 'Michroma', sans-serif; font-weight: 900; fill: var(--text-main); }

        /* =============================================
           CANVAS EXTERNA
        ============================================= */
        body.dark { background-color: #08090b; background-image: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(104,91,199,0.18) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 80% 90%, rgba(30,25,60,0.4) 0%, transparent 55%); }
        body:not(.dark) { background-color: #c8d1e0; background-image: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(104,91,199,0.14) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 80% 90%, rgba(148,163,184,0.35) 0%, transparent 55%); }

        /* =============================================
           APP BOX
        ============================================= */
        #app-box {
            position: fixed; inset: 12px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; transition: box-shadow 0.3s ease;
        }

        body.dark #app-box {
            background-color: #0f1013;
            background-image: radial-gradient(ellipse 90% 50% at 85% 5%, rgba(104,91,199,0.12) 0%, transparent 55%), radial-gradient(ellipse 60% 40% at 10% 95%, rgba(104,91,199,0.07) 0%, transparent 50%);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 20px 60px rgba(0,0,0,0.7);
            --glass-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.07); --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --text-main: #ffffff; --text-muted: rgba(255,255,255,0.35); --text-muted-strong: rgba(255,255,255,0.55);
            --glow-shadow: 0 0 24px rgba(255,255,255,0.15); --glow-accent: 0 0 20px rgba(104,91,199,0.5); --glow-green: 0 0 15px rgba(34,197,94,0.3);
            --neon-bg: radial-gradient(circle at top right, rgba(104,91,199,0.12), transparent 60%); --input-bg: rgba(255,255,255,0.05);
            --bg-sticky: rgba(15,16,19,0.92); --hover-table: rgba(104,91,199,0.05); --table-wrapper-bg: rgba(255,255,255,0.02);
        }
        body:not(.dark) #app-box {
            background-color: rgba(245,248,252,0.96);
            background-image: 
                radial-gradient(ellipse 120% 80% at 15% 20%, rgba(104,91,199,0.06) 0%, transparent 50%),
                radial-gradient(ellipse 100% 60% at 85% 85%, rgba(148,163,184,0.08) 0%, transparent 55%);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.8),
                0 8px 32px rgba(104,91,199,0.08),
                inset 0 1px 0 rgba(255,255,255,0.6);
            --glass-bg: rgba(255,255,255,0.75); 
            --glass-border: rgba(255,255,255,0.95); 
            --glass-shadow: 0 8px 32px rgba(15,23,42,0.08);
            --text-main: #292929; 
            --text-muted: #6b7280; 
            --text-muted-strong: #374151;
            --glow-shadow: 0 0 20px rgba(104,91,199,0.12); 
            --glow-accent: 0 0 15px rgba(104,91,199,0.2); 
            --glow-green: 0 0 15px rgba(34,197,94,0.2);
            --neon-bg: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(104,91,199,0.04) 100%); 
            --input-bg: rgba(255,255,255,0.92);
            --bg-sticky: rgba(245,248,252,0.95); 
            --hover-table: rgba(104,91,199,0.05); 
            --table-wrapper-bg: rgba(255,255,255,0.4);
        }

        /* =============================================
           FLOATING UI (NOVO SISTEMA FLEX)
        ============================================= */
        #floating-ui { 
            position: relative; 
            flex-shrink: 0; 
            z-index: 100; 
            padding: 18px 24px 28px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Glassmorfismo no topo quando há scroll */
        #floating-ui.scrolled {
            background: rgba(15, 16, 19, 0.92) !important;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        
        body:not(.dark) #floating-ui.scrolled {
            background: rgba(245,248,252,0.96) !important;
            box-shadow: 
                0 4px 24px rgba(15,23,42,0.08),
                0 0 0 1px rgba(255,255,255,0.8);
        }
        
        /* Gradiente de fade suave na borda inferior */
        #floating-ui::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            height: 30px;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #floating-ui.scrolled::after {
            opacity: 1;
        }
        
        body.dark #floating-ui::after {
            background: linear-gradient(to bottom, rgba(15, 16, 19, 0.85) 0%, transparent 100%);
        }
        
        body:not(.dark) #floating-ui::after {
            background: linear-gradient(to bottom, rgba(238, 243, 250, 0.85) 0%, transparent 100%);
        }

        #topbar-row { 
            display: flex; align-items: center; justify-content: space-between; 
            gap: 12px; height: 72px; width: 100%; 
        }

        #float-logo { 
            display: flex; align-items: center; gap: 10px; 
            flex: 1; min-width: 0; 
        }
        #float-logo img { 
            height: 46px; 
            width: auto; 
            object-fit: contain; 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
            transition: filter 0.3s ease;
        }
        body:not(.dark) #float-logo img {
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
        }
        #float-logo-badge { font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; padding: 5px 12px; border-radius: 999px; }
        body.dark #float-logo-badge { background: rgba(104,91,199,0.15); border: 1px solid rgba(104,91,199,0.3); color: rgba(168,159,238,0.9); }
        body:not(.dark) #float-logo-badge { 
            background: rgba(104,91,199,0.12); 
            border: 1px solid rgba(104,91,199,0.3); 
            color: #685BC7;
            box-shadow: 0 2px 8px rgba(104,91,199,0.1);
        }

        #nav-and-filter-wrapper { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            flex-shrink: 0; 
        }

        #float-nav { position: relative; display: flex; align-items: center; padding: 5px; border-radius: 999px; gap: 0; }
        body.dark #float-nav { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07); }
        body:not(.dark) #float-nav { 
            background: rgba(255,255,255,0.82); 
            border: 1px solid rgba(255,255,255,0.98); 
            box-shadow: 
                0 4px 24px rgba(15,23,42,0.08), 
                inset 0 1px 0 rgba(255,255,255,1),
                0 0 0 1px rgba(104,91,199,0.08);
        }

        #nav-indicator { position: absolute; top: 5px; left: 5px; height: calc(100% - 10px); border-radius: 999px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; z-index: 0; }
        body.dark #nav-indicator { background: rgba(104,91,199,0.3); box-shadow: 0 2px 12px rgba(104,91,199,0.25); border: 1px solid rgba(104,91,199,0.45); }
        body:not(.dark) #nav-indicator { 
            background: rgba(255,255,255,0.98); 
            box-shadow: 
                0 2px 12px rgba(104,91,199,0.15),
                0 0 0 1px rgba(104,91,199,0.25);
            border: 1px solid rgba(104,91,199,0.25);
        }

        .nav-pill { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; padding: 8px 18px; border-radius: 999px; border: none; cursor: pointer; transition: color 0.2s ease; white-space: nowrap; background: none; }
        body.dark .nav-pill { color: rgba(255,255,255,0.38); }
        body.dark .nav-pill:hover { color: rgba(255,255,255,0.7); }
        body.dark .nav-pill.active { color: #fff; }
        body:not(.dark) .nav-pill { color: #6b7280; }
        body:not(.dark) .nav-pill:hover { color: #292929; }
        body:not(.dark) .nav-pill.active { color: #685BC7; }

        /* --- BOTÃO DE FILTROS REFORMULADO --- */
        #btn-toggle-filters {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid transparent; cursor: pointer; flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, box-shadow 0.3s, border-color 0.3s, color 0.3s;
        }

        body.dark #btn-toggle-filters { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.09); color: rgba(255,255,255,0.6); }
        body:not(.dark) #btn-toggle-filters { 
            background: rgba(255,255,255,0.82); 
            border-color: rgba(255,255,255,0.98); 
            color: #6b7280; 
            box-shadow: 0 4px 12px rgba(15,23,42,0.06), 0 0 0 1px rgba(104,91,199,0.08);
        }
        body:not(.dark) #btn-toggle-filters:hover { 
            border-color: rgba(104,91,199,0.5); 
            box-shadow: 0 0 15px rgba(104,91,199,0.2), 0 4px 12px rgba(15,23,42,0.08); 
            color: #685BC7;
        }

        #btn-toggle-filters.active {
            background: var(--ps-blue) !important; color: white !important;
            border-color: var(--ps-blue) !important; box-shadow: 0 4px 15px rgba(104,91,199,0.4) !important;
        }

        #float-controls-wrapper {
            display: flex; justify-content: flex-end; 
            flex: 1; min-width: 0; 
        }

        #float-controls { 
            display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: 999px; 
            max-width: 100%; flex-shrink: 1; position: relative; z-index: 110;
        }
        body.dark #float-controls { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07); }
        body:not(.dark) #float-controls { 
            background: rgba(255,255,255,0.82); 
            border: 1px solid rgba(255,255,255,0.98); 
            box-shadow: 
                0 4px 24px rgba(15,23,42,0.08), 
                inset 0 1px 0 rgba(255,255,255,1),
                0 0 0 1px rgba(104,91,199,0.08);
        }

        #topbar-user-email { 
            white-space: nowrap; padding: 0 8px; 
            overflow: hidden; text-overflow: ellipsis;
            flex-shrink: 1; min-width: 50px;
        }
        body.dark #topbar-user-email { color: rgba(255,255,255,0.4); }
        body:not(.dark) #topbar-user-email { color: #6b7280; }

        .ctrl-divider { width: 1px; height: 18px; flex-shrink: 0; border-radius: 1px; margin: 0 8px; }
        body.dark .ctrl-divider { background: rgba(255,255,255,0.09); }
        body:not(.dark) .ctrl-divider { background: rgba(15,23,42,0.12); }

        .ctrl-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; transition: all 0.18s ease; background: none; font-size: 14px; flex-shrink: 0; }
        body.dark .ctrl-btn { color: rgba(255,255,255,0.45); }
        body.dark .ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.09); }
        body:not(.dark) .ctrl-btn { color: #6b7280; }
        body:not(.dark) .ctrl-btn:hover { color: #292929; background: rgba(15,23,42,0.08); }

        #btn-logout { display: flex; align-items: center; gap: 5px; padding: 6px 12px 6px 9px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all 0.18s ease; background: none; flex-shrink: 0; }
        body.dark #btn-logout { color: rgba(239,68,68,0.5); border-color: rgba(239,68,68,0.15); }
        body.dark #btn-logout:hover { color: #ef4444; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.35); }
        body:not(.dark) #btn-logout { 
            color: rgba(239,68,68,0.55); 
            border-color: rgba(239,68,68,0.15);
        }
        body:not(.dark) #btn-logout:hover { 
            color: #ef4444; 
            background: rgba(239,68,68,0.08); 
            border-color: rgba(239,68,68,0.35);
        }

        /* =============================================
           FILTER BAR ANIMATION UNIFICADA
        ============================================= */
       #filterbar-row {
    display: flex; align-items: flex-end; justify-content: center; flex-wrap: wrap;
    position: relative; 
    z-index: 100;
}

#filterbar-row.filters-hidden {
    max-height: 0; opacity: 0; transform: translateY(-12px); pointer-events: none; gap: 0; margin: 0; overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                gap 0.3s ease,
                margin 0.3s ease;
}

#filterbar-row.filters-open {
    max-height: 400px; opacity: 1; transform: translateY(0); pointer-events: auto; gap: 12px; margin-top: 10px; overflow: visible;
    transition: max-height 0.4s cubic-bezier(0.0, 0, 0.2, 1),
                opacity 0.3s cubic-bezier(0.0, 0, 0.2, 1) 0.05s,
                transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                gap 0.3s ease,
                margin 0.3s ease;
}

        @media (max-width: 768px) {
            #filterbar-row.filters-open {
                display: grid !important; 
                grid-template-columns: repeat(2, minmax(0, 1fr)); 
            }
        }

        /* =============================================
           CONTENT AREA 
        ============================================= */
        #app-content-wrapper { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; position: relative; z-index: 10; }
        #app-content { padding: 0 22px 28px; width: 100%; }

        /* =============================================
           RESPONSIVE — INSTÂNCIAS DE COLISÃO
        ============================================= */
        @media (max-width: 1280px) {
            #float-nav .nav-label { display: none; }
            .nav-pill { padding: 10px 14px; }
        }

        @media (max-width: 768px) {
            #app-box { inset: 8px; border-radius: 16px; }
            #topbar-row { flex-direction: column; height: auto; gap: 12px; padding-bottom: 6px; }
            
            #float-logo { order: 1; width: 100%; justify-content: center; }
            #float-logo-badge { display: none !important; } 
            
            #float-controls-wrapper { order: 2; width: 100%; justify-content: center; margin: 0 auto; }
            
            #nav-and-filter-wrapper { order: 3; width: 100%; justify-content: center; }
            
            #floating-ui { padding: 10px 12px 15px; gap: 12px; }
            
            #date-slicer-container { grid-column: span 2; } 
            #btn-date-slicer { width: 100%; }
        }

        /* =============================================
           CARDS & MISC
        ============================================= */
        body.dark .card { background-color: #1c1e22; border-color: #2d3139; }
        body.dark .text-muted { color: #8e94a0; }
        body:not(.dark) .card { 
            background-color: rgba(255,255,255,0.85); 
            border: 1px solid rgba(255,255,255,0.98);
            box-shadow:

    <script>
    // GPU Lite Mode: detecta hardware fraco e ativa otimizações
    (function() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL).toLowerCase();
                    // Detecta GPUs integradas Intel/AMD comuns em notebooks corporativos
                    const isWeakGPU = /intel.*uhd|intel.*hd|intel.*iris(?!.*xe)|radeon.*vega\s?[3-8]|mali|adreno\s?[1-5]/i.test(renderer);
                    if (isWeakGPU) {
                        document.body.classList.add('gpu-lite');
                        console.log('🔋 GPU Lite Mode ativado — GPU detectada:', renderer);
                    }
                }
            }
            // Também ativa se o dispositivo tem pouca memória (< 4GB)
            if (navigator.deviceMemory && navigator.deviceMemory < 4) {
                document.body.classList.add('gpu-lite');
                console.log('🔋 GPU Lite Mode ativado — memória baixa:', navigator.deviceMemory + 'GB');
            }
        } catch(e) { /* silencioso */ }
    })();

    <script>
        // ---- THEME ICONS ----
        function syncThemeIcons() {
            const dark = document.body.classList.contains('dark');
            document.querySelectorAll('.theme-icon-dark').forEach(el => el.style.display = dark ? '' : 'none');
            document.querySelectorAll('.theme-icon-light').forEach(el => el.style.display = dark ? 'none' : '');
        }
        syncThemeIcons();
        new MutationObserver(syncThemeIcons).observe(document.body, { attributes: true, attributeFilter: ['class'] });

        // ---- MOBILE & DESKTOP FILTER TOGGLE (UNIFICADO) ----
        const btnToggleFilters = document.getElementById('btn-toggle-filters');
        if(btnToggleFilters) {
            btnToggleFilters.addEventListener('click', () => {
                const filterBar = document.getElementById('filterbar-row');
                const isHidden = filterBar.classList.contains('filters-hidden');
                
                // Toggle visual classes
                if (isHidden) {
                    filterBar.classList.remove('filters-hidden');
                    filterBar.classList.add('filters-open');
                    btnToggleFilters.classList.add('active');
                } else {
                    filterBar.classList.add('filters-hidden');
                    filterBar.classList.remove('filters-open');
                    btnToggleFilters.classList.remove('active');
                }

                // Animação orgânica de clique
                btnToggleFilters.style.transform = 'scale(0.85)';
                setTimeout(() => {
                    btnToggleFilters.style.transform = 'scale(1)';
                }, 150);
            });
        }

        // ---- NAV SLIDING INDICATOR ----
        function updateNavIndicator() {
            const active = document.querySelector('#float-nav .nav-pill.active');
            const indicator = document.getElementById('nav-indicator');
            const nav = document.getElementById('float-nav');
            if (!active || !indicator || !nav) return;
            
            requestAnimationFrame(() => {
                const navRect = nav.getBoundingClientRect();
                const activeRect = active.getBoundingClientRect();
                indicator.style.width = activeRect.width + 'px';
                indicator.style.transform = `translateX(${activeRect.left - navRect.left - 5}px)`;
            });
        }

        window.addEventListener('load', () => setTimeout(updateNavIndicator, 100));
        window.addEventListener('resize', updateNavIndicator);

        document.querySelectorAll('#float-nav .nav-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#float-nav .nav-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateNavIndicator();
                
                // Fecha os filtros auto caso estejam abertos ao navegar em telas menores
                const filterBar = document.getElementById('filterbar-row');
                if(window.innerWidth <= 1280 && filterBar.classList.contains('filters-open')) {
                    filterBar.classList.remove('filters-open');
                    filterBar.classList.add('filters-hidden');
                    if(btnToggleFilters) btnToggleFilters.classList.remove('active');
                }
            });
        });

        const shellObs = new MutationObserver(() => {
            if (document.getElementById('dash-shell').style.display !== 'none') {
                setTimeout(updateNavIndicator, 150);
            }
        });
        shellObs.observe(document.getElementById('dash-shell'), { attributes: true, attributeFilter: ['style'] });

        // ---- GLASSMORFISMO NO SCROLL ----
        const appContentWrapper = document.getElementById('app-content-wrapper');
        const floatingUi = document.getElementById('floating-ui');
        
        if (appContentWrapper && floatingUi) {
            appContentWrapper.addEventListener('scroll', () => {
                if (appContentWrapper.scrollTop > 20) {
                    floatingUi.classList.add('scrolled');
                } else {
                    floatingUi.classList.remove('scrolled');
                }
            });
        }
    </script>
